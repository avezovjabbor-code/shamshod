<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Zamonaviy desktop kalkulyator - qo'shish, ayirish, ko'paytirish, bo'lish va boshqa amallar">
    <title>Desktop Kalkulyator</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #0a0a1a;
            --bg-secondary: #12122a;
            --glass-bg: rgba(255, 255, 255, 0.04);
            --glass-border: rgba(255, 255, 255, 0.08);
            --glass-hover: rgba(255, 255, 255, 0.08);
            --text-primary: #e8e8f0;
            --text-secondary: #8888a8;
            --text-dim: #55556a;
            --accent-orange: #ff6b35;
            --accent-orange-glow: rgba(255, 107, 53, 0.3);
            --accent-purple: #a855f7;
            --accent-purple-glow: rgba(168, 85, 247, 0.2);
            --accent-cyan: #06b6d4;
            --btn-number: rgba(255, 255, 255, 0.06);
            --btn-number-hover: rgba(255, 255, 255, 0.12);
            --btn-operator: rgba(255, 107, 53, 0.12);
            --btn-operator-hover: rgba(255, 107, 53, 0.25);
            --btn-function: rgba(168, 85, 247, 0.1);
            --btn-function-hover: rgba(168, 85, 247, 0.22);
            --btn-equals: linear-gradient(135deg, #ff6b35, #ff8c42);
            --shadow-soft: 0 8px 32px rgba(0, 0, 0, 0.3);
            --shadow-glow: 0 0 60px rgba(255, 107, 53, 0.08);
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        /* Animated background */
        .bg-orbs {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.4;
            animation: float 20s ease-in-out infinite;
        }

        .orb-1 {
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(255, 107, 53, 0.15), transparent 70%);
            top: -10%;
            right: -5%;
            animation-delay: 0s;
        }

        .orb-2 {
            width: 350px;
            height: 350px;
            background: radial-gradient(circle, rgba(168, 85, 247, 0.12), transparent 70%);
            bottom: -10%;
            left: -5%;
            animation-delay: -7s;
        }

        .orb-3 {
            width: 250px;
            height: 250px;
            background: radial-gradient(circle, rgba(6, 182, 212, 0.1), transparent 70%);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            animation-delay: -14s;
        }

        @keyframes float {
            0%, 100% { transform: translate(0, 0) scale(1); }
            25% { transform: translate(30px, -40px) scale(1.05); }
            50% { transform: translate(-20px, 20px) scale(0.95); }
            75% { transform: translate(15px, 35px) scale(1.02); }
        }

        /* Grid pattern overlay */
        .grid-pattern {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(rgba(255, 255, 255, 0.015) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.015) 1px, transparent 1px);
            background-size: 60px 60px;
            pointer-events: none;
            z-index: 0;
        }

        /* Calculator container */
        .calculator-wrapper {
            position: relative;
            z-index: 1;
        }

        .calculator {
            width: 380px;
            background: var(--bg-secondary);
            border: 1px solid var(--glass-border);
            border-radius: 28px;
            padding: 28px;
            box-shadow: var(--shadow-soft), var(--shadow-glow);
            backdrop-filter: blur(20px);
            position: relative;
            overflow: hidden;
            animation: calcAppear 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            opacity: 0;
            transform: translateY(30px) scale(0.95);
        }

        @keyframes calcAppear {
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .calculator::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.1), transparent);
        }

        /* Header */
        .calc-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
            padding: 0 4px;
        }

        .calc-title {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-secondary);
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .calc-dots {
            display: flex;
            gap: 6px;
        }

        .calc-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            opacity: 0.7;
        }

        .calc-dot:nth-child(1) { background: #ff5f57; }
        .calc-dot:nth-child(2) { background: #ffbd2e; }
        .calc-dot:nth-child(3) { background: #27c93f; }

        /* Display */
        .display {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.04);
            border-radius: 18px;
            padding: 24px 24px 20px;
            margin-bottom: 20px;
            min-height: 120px;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: flex-end;
            position: relative;
            overflow: hidden;
        }

        .display::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--accent-orange), transparent);
            opacity: 0.4;
        }

        .expression {
            font-size: 15px;
            font-weight: 400;
            color: var(--text-secondary);
            margin-bottom: 8px;
            min-height: 22px;
            word-break: break-all;
            text-align: right;
            width: 100%;
            transition: color 0.3s ease;
        }

        .result {
            font-size: 42px;
            font-weight: 300;
            color: var(--text-primary);
            letter-spacing: -1px;
            word-break: break-all;
            text-align: right;
            width: 100%;
            transition: all 0.2s ease;
            line-height: 1.1;
        }

        .result.shrink {
            font-size: 32px;
        }

        .result.error {
            color: #ff5f57;
            font-size: 24px;
        }

        /* History display */
        .history-container {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            margin-bottom: 0;
        }

        .history-container.open {
            max-height: 200px;
            margin-bottom: 16px;
        }

        .history-panel {
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.04);
            border-radius: 14px;
            padding: 12px 16px;
            max-height: 180px;
            overflow-y: auto;
        }

        .history-panel::-webkit-scrollbar {
            width: 4px;
        }

        .history-panel::-webkit-scrollbar-track {
            background: transparent;
        }

        .history-panel::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 2px;
        }

        .history-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 6px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.03);
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .history-item:hover {
            opacity: 0.7;
        }

        .history-item:last-child {
            border-bottom: none;
        }

        .history-expr {
            font-size: 12px;
            color: var(--text-dim);
        }

        .history-result {
            font-size: 14px;
            font-weight: 500;
            color: var(--text-secondary);
        }

        .history-empty {
            font-size: 12px;
            color: var(--text-dim);
            text-align: center;
            padding: 8px 0;
        }

        /* Button grid */
        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }

        .btn {
            height: 62px;
            border: 1px solid transparent;
            border-radius: 16px;
            font-family: 'Inter', sans-serif;
            font-size: 20px;
            font-weight: 500;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.15s ease;
            position: relative;
            overflow: hidden;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        .btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            border-radius: 16px;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        /* Number buttons */
        .btn-number {
            background: var(--btn-number);
            color: var(--text-primary);
            border-color: rgba(255, 255, 255, 0.04);
        }

        .btn-number:hover {
            background: var(--btn-number-hover);
            border-color: rgba(255, 255, 255, 0.08);
            transform: translateY(-1px);
        }

        .btn-number:active {
            transform: translateY(1px) scale(0.97);
            background: rgba(255, 255, 255, 0.15);
        }

        /* Operator buttons */
        .btn-operator {
            background: var(--btn-operator);
            color: var(--accent-orange);
            border-color: rgba(255, 107, 53, 0.1);
            font-size: 22px;
        }

        .btn-operator:hover {
            background: var(--btn-operator-hover);
            border-color: rgba(255, 107, 53, 0.2);
            transform: translateY(-1px);
            box-shadow: 0 4px 15px rgba(255, 107, 53, 0.1);
        }

        .btn-operator:active {
            transform: translateY(1px) scale(0.97);
        }

        .btn-operator.active {
            background: rgba(255, 107, 53, 0.3);
            border-color: rgba(255, 107, 53, 0.4);
            box-shadow: 0 0 20px rgba(255, 107, 53, 0.15);
        }

        /* Function buttons */
        .btn-function {
            background: var(--btn-function);
            color: var(--accent-purple);
            border-color: rgba(168, 85, 247, 0.08);
            font-size: 17px;
            font-weight: 600;
        }

        .btn-function:hover {
            background: var(--btn-function-hover);
            border-color: rgba(168, 85, 247, 0.15);
            transform: translateY(-1px);
        }

        .btn-function:active {
            transform: translateY(1px) scale(0.97);
        }

        /* Equals button */
        .btn-equals {
            background: var(--btn-equals);
            color: white;
            font-size: 24px;
            font-weight: 600;
            border: none;
            box-shadow: 0 4px 15px rgba(255, 107, 53, 0.25);
        }

        .btn-equals:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 25px rgba(255, 107, 53, 0.35);
            filter: brightness(1.1);
        }

        .btn-equals:active {
            transform: translateY(1px) scale(0.97);
            box-shadow: 0 2px 10px rgba(255, 107, 53, 0.2);
        }

        /* Zero button spans 2 columns */
        .btn-zero {
            grid-column: span 2;
        }

        /* History toggle button */
        .btn-history {
            background: rgba(6, 182, 212, 0.08);
            color: var(--accent-cyan);
            border-color: rgba(6, 182, 212, 0.08);
            font-size: 16px;
        }

        .btn-history:hover {
            background: rgba(6, 182, 212, 0.18);
            border-color: rgba(6, 182, 212, 0.15);
            transform: translateY(-1px);
        }

        .btn-history:active {
            transform: translateY(1px) scale(0.97);
        }

        .btn-history.active-hist {
            background: rgba(6, 182, 212, 0.2);
            border-color: rgba(6, 182, 212, 0.3);
        }

        /* Ripple effect */
        .ripple {
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.15);
            transform: scale(0);
            animation: rippleAnim 0.5s ease-out;
            pointer-events: none;
        }

        @keyframes rippleAnim {
            to {
                transform: scale(4);
                opacity: 0;
            }
        }

        /* Keyboard indicator */
        .keyboard-hint {
            text-align: center;
            margin-top: 16px;
            font-size: 11px;
            color: var(--text-dim);
            letter-spacing: 0.5px;
        }

        .keyboard-hint kbd {
            display: inline-block;
            padding: 2px 6px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 4px;
            font-family: 'Inter', sans-serif;
            font-size: 10px;
            color: var(--text-secondary);
        }

        /* Result animation */
        @keyframes resultPulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.02); }
            100% { transform: scale(1); }
        }

        .result.pulse {
            animation: resultPulse 0.2s ease;
        }

        /* Responsive */
        @media (max-width: 420px) {
            .calculator {
                width: 340px;
                padding: 20px;
                border-radius: 22px;
            }

            .btn {
                height: 56px;
                border-radius: 14px;
            }

            .result {
                font-size: 36px;
            }
        }
    </style>
</head>
<body>
    <div class="bg-orbs">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
        <div class="orb orb-3"></div>
    </div>
    <div class="grid-pattern"></div>

    <div class="calculator-wrapper">
        <div class="calculator">
            <div class="calc-header">
                <div class="calc-dots">
                    <div class="calc-dot"></div>
                    <div class="calc-dot"></div>
                    <div class="calc-dot"></div>
                </div>
                <div class="calc-title">Kalkulyator</div>
            </div>

            <div class="display" id="display">
                <div class="expression" id="expression"></div>
                <div class="result" id="result">0</div>
            </div>

            <div class="history-container" id="historyContainer">
                <div class="history-panel" id="historyPanel">
                    <div class="history-empty">Tarix bo'sh</div>
                </div>
            </div>

            <div class="buttons">
                <!-- Row 1: Function buttons -->
                <button class="btn btn-function" id="btnClear" onclick="clearAll()">AC</button>
                <button class="btn btn-function" id="btnSign" onclick="toggleSign()">+/−</button>
                <button class="btn btn-function" id="btnPercent" onclick="percentage()">%</button>
                <button class="btn btn-operator" id="btnDivide" onclick="setOperator('÷')" data-op="÷">÷</button>

                <!-- Row 2 -->
                <button class="btn btn-number" id="btn7" onclick="appendNumber('7')">7</button>
                <button class="btn btn-number" id="btn8" onclick="appendNumber('8')">8</button>
                <button class="btn btn-number" id="btn9" onclick="appendNumber('9')">9</button>
                <button class="btn btn-operator" id="btnMultiply" onclick="setOperator('×')" data-op="×">×</button>

                <!-- Row 3 -->
                <button class="btn btn-number" id="btn4" onclick="appendNumber('4')">4</button>
                <button class="btn btn-number" id="btn5" onclick="appendNumber('5')">5</button>
                <button class="btn btn-number" id="btn6" onclick="appendNumber('6')">6</button>
                <button class="btn btn-operator" id="btnSubtract" onclick="setOperator('−')" data-op="−">−</button>

                <!-- Row 4 -->
                <button class="btn btn-number" id="btn1" onclick="appendNumber('1')">1</button>
                <button class="btn btn-number" id="btn2" onclick="appendNumber('2')">2</button>
                <button class="btn btn-number" id="btn3" onclick="appendNumber('3')">3</button>
                <button class="btn btn-operator" id="btnAdd" onclick="setOperator('+')" data-op="+">+</button>

                <!-- Row 5 -->
                <button class="btn btn-history" id="btnHistory" onclick="toggleHistory()">⏱</button>
                <button class="btn btn-number" id="btn0" onclick="appendNumber('0')">0</button>
                <button class="btn btn-number" id="btnDecimal" onclick="appendDecimal()">.</button>
                <button class="btn btn-equals" id="btnEquals" onclick="calculate()">=</button>
            </div>

            <div class="keyboard-hint">
                <kbd>0-9</kbd> raqamlar &nbsp; <kbd>Enter</kbd> hisoblash &nbsp; <kbd>Esc</kbd> tozalash
            </div>
        </div>
    </div>

    <script>
        // ==================== State ====================
        let currentValue = '0';
        let previousValue = '';
        let operator = null;
        let shouldResetScreen = false;
        let history = [];

        // ==================== DOM ====================
        const resultEl = document.getElementById('result');
        const expressionEl = document.getElementById('expression');
        const historyContainer = document.getElementById('historyContainer');
        const historyPanel = document.getElementById('historyPanel');

        // ==================== Core Functions ====================

        function updateDisplay() {
            resultEl.textContent = formatNumber(currentValue);
            // Auto-shrink for long numbers
            if (currentValue.length > 10) {
                resultEl.classList.add('shrink');
            } else {
                resultEl.classList.remove('shrink');
            }
        }

        function formatNumber(num) {
            if (num === 'Xato' || num === 'Infinity' || num === '-Infinity') return 'Xato';
            if (num.includes('.') && num.endsWith('.')) return num;
            
            const parts = num.split('.');
            let intPart = parts[0];
            const isNegative = intPart.startsWith('-');
            if (isNegative) intPart = intPart.slice(1);

            // Add thousand separators
            if (intPart.length > 3) {
                intPart = intPart.replace(/\B(?=(\d{3})+(?!\d))/g, ',');
            }

            let formatted = (isNegative ? '-' : '') + intPart;
            if (parts.length === 2) {
                formatted += '.' + parts[1];
            }
            return formatted;
        }

        function appendNumber(num) {
            if (currentValue === 'Xato') clearAll();
            
            if (shouldResetScreen) {
                currentValue = num;
                shouldResetScreen = false;
            } else if (currentValue === '0' && num !== '0') {
                currentValue = num;
            } else if (currentValue === '0' && num === '0') {
                return;
            } else {
                if (currentValue.replace('-', '').replace('.', '').length >= 15) return;
                currentValue += num;
            }
            updateDisplay();
            pulseResult();
        }

        function appendDecimal() {
            if (shouldResetScreen) {
                currentValue = '0.';
                shouldResetScreen = false;
            } else if (!currentValue.includes('.')) {
                currentValue += '.';
            }
            updateDisplay();
        }

        function setOperator(op) {
            if (currentValue === 'Xato') return;
            
            if (operator && !shouldResetScreen) {
                calculate(true);
            }
            
            previousValue = currentValue;
            operator = op;
            shouldResetScreen = true;
            expressionEl.textContent = `${formatNumber(previousValue)} ${operator}`;
            
            // Highlight active operator
            document.querySelectorAll('.btn-operator').forEach(btn => btn.classList.remove('active'));
            const activeBtn = document.querySelector(`[data-op="${op}"]`);
            if (activeBtn) activeBtn.classList.add('active');
        }

        function calculate(isChained = false) {
            if (!operator || previousValue === '') return;
            
            const prev = parseFloat(previousValue);
            const curr = parseFloat(currentValue);
            let result;

            switch (operator) {
                case '+': result = prev + curr; break;
                case '−': result = prev - curr; break;
                case '×': result = prev * curr; break;
                case '÷':
                    if (curr === 0) {
                        currentValue = 'Xato';
                        resultEl.classList.add('error');
                        expressionEl.textContent = `${formatNumber(previousValue)} ÷ 0`;
                        updateDisplay();
                        setTimeout(() => resultEl.classList.remove('error'), 2000);
                        operator = null;
                        previousValue = '';
                        shouldResetScreen = true;
                        return;
                    }
                    result = prev / curr;
                    break;
                default: return;
            }

            // Build expression string
            const expr = `${formatNumber(previousValue)} ${operator} ${formatNumber(currentValue)}`;
            
            // Handle floating point precision
            result = parseFloat(result.toPrecision(12));
            const resultStr = String(result);
            
            if (!isChained) {
                expressionEl.textContent = `${expr} =`;
                // Add to history
                addToHistory(expr, resultStr);
            }

            currentValue = resultStr;
            operator = null;
            previousValue = '';
            shouldResetScreen = true;
            
            // Clear active operator highlight
            document.querySelectorAll('.btn-operator').forEach(btn => btn.classList.remove('active'));
            
            updateDisplay();
            pulseResult();
        }

        function clearAll() {
            currentValue = '0';
            previousValue = '';
            operator = null;
            shouldResetScreen = false;
            expressionEl.textContent = '';
            resultEl.classList.remove('error', 'shrink');
            document.querySelectorAll('.btn-operator').forEach(btn => btn.classList.remove('active'));
            updateDisplay();
        }

        function toggleSign() {
            if (currentValue === '0' || currentValue === 'Xato') return;
            if (currentValue.startsWith('-')) {
                currentValue = currentValue.slice(1);
            } else {
                currentValue = '-' + currentValue;
            }
            updateDisplay();
        }

        function percentage() {
            if (currentValue === 'Xato') return;
            const val = parseFloat(currentValue);
            currentValue = String(parseFloat((val / 100).toPrecision(12)));
            updateDisplay();
            pulseResult();
        }

        // ==================== History ====================

        function addToHistory(expr, result) {
            history.unshift({ expr, result });
            if (history.length > 20) history.pop();
            renderHistory();
        }

        function renderHistory() {
            if (history.length === 0) {
                historyPanel.innerHTML = '<div class="history-empty">Tarix bo\'sh</div>';
                return;
            }
            historyPanel.innerHTML = history.map((item, i) => `
                <div class="history-item" onclick="loadFromHistory(${i})">
                    <span class="history-expr">${item.expr}</span>
                    <span class="history-result">= ${formatNumber(item.result)}</span>
                </div>
            `).join('');
        }

        function loadFromHistory(index) {
            const item = history[index];
            currentValue = item.result;
            shouldResetScreen = true;
            expressionEl.textContent = item.expr + ' =';
            updateDisplay();
        }

        function toggleHistory() {
            const btn = document.getElementById('btnHistory');
            historyContainer.classList.toggle('open');
            btn.classList.toggle('active-hist');
        }

        // ==================== Effects ====================

        function pulseResult() {
            resultEl.classList.remove('pulse');
            void resultEl.offsetWidth; // trigger reflow
            resultEl.classList.add('pulse');
        }

        // Ripple effect on buttons
        document.querySelectorAll('.btn').forEach(button => {
            button.addEventListener('click', function(e) {
                const ripple = document.createElement('span');
                ripple.classList.add('ripple');
                const rect = this.getBoundingClientRect();
                const size = Math.max(rect.width, rect.height);
                ripple.style.width = ripple.style.height = size + 'px';
                ripple.style.left = (e.clientX - rect.left - size / 2) + 'px';
                ripple.style.top = (e.clientY - rect.top - size / 2) + 'px';
                this.appendChild(ripple);
                setTimeout(() => ripple.remove(), 500);
            });
        });

        // ==================== Keyboard Support ====================

        document.addEventListener('keydown', (e) => {
            e.preventDefault();
            
            if (e.key >= '0' && e.key <= '9') {
                appendNumber(e.key);
                flashButton(`btn${e.key}`);
            } else if (e.key === '.') {
                appendDecimal();
                flashButton('btnDecimal');
            } else if (e.key === '+') {
                setOperator('+');
                flashButton('btnAdd');
            } else if (e.key === '-') {
                setOperator('−');
                flashButton('btnSubtract');
            } else if (e.key === '*') {
                setOperator('×');
                flashButton('btnMultiply');
            } else if (e.key === '/') {
                setOperator('÷');
                flashButton('btnDivide');
            } else if (e.key === 'Enter' || e.key === '=') {
                calculate();
                flashButton('btnEquals');
            } else if (e.key === 'Escape' || e.key === 'Delete') {
                clearAll();
                flashButton('btnClear');
            } else if (e.key === '%') {
                percentage();
                flashButton('btnPercent');
            } else if (e.key === 'Backspace') {
                backspace();
            }
        });

        function backspace() {
            if (shouldResetScreen || currentValue === 'Xato') {
                clearAll();
                return;
            }
            if (currentValue.length === 1 || (currentValue.length === 2 && currentValue.startsWith('-'))) {
                currentValue = '0';
            } else {
                currentValue = currentValue.slice(0, -1);
            }
            updateDisplay();
        }

        function flashButton(id) {
            const btn = document.getElementById(id);
            if (!btn) return;
            btn.style.transform = 'scale(0.95)';
            btn.style.filter = 'brightness(1.3)';
            setTimeout(() => {
                btn.style.transform = '';
                btn.style.filter = '';
            }, 100);
        }

        // ==================== Init ====================
        updateDisplay();
    </script>
</body>
</html>
